name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest   # внешний runner; briix-ci (self-hosted) — только по явной команде владельца
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: node --check (studio + tools)
        run: |
          for f in studio/*.js tools/*.cjs; do node --check "$f"; done
      - name: check-producer
        run: node tools/check-producer.cjs
      - name: check-session-store
        run: node tools/check-session-store.cjs
        env:
          NODE_PATH: ./node_modules
      - name: check-studio-storage
        run: node tools/check-studio-storage.cjs
        env:
          NODE_PATH: ./node_modules
      - name: check-waveform
        run: node tools/check-waveform.cjs
        env:
          NODE_PATH: ./node_modules
      - name: check-studio
        run: node tools/check-studio.cjs
        env:
          NODE_PATH: ./node_modules
      - name: check-wait-phrases
        # Сюита поднимает свой сервер на 127.0.0.1 — локально детерминирована;
        # continue-on-error как страховка на случай окружения runner'а, ассерты не глушатся.
        continue-on-error: true
        run: node tools/check-wait-phrases.cjs
        env:
          NODE_PATH: ./node_modules

  deploy-stand:
    # Единственный писец /home/badai/briix-demo/studio (briix.ru#107): briix.ru больше не деплоит studio/.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy studio/ to fonotext-stand:/home/badai/briix-demo/studio
        env:
          SSH_KEY: ${{ secrets.STAND_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H fonotext-stand >> ~/.ssh/known_hosts 2>/dev/null
          rsync -a --delete --exclude='assets/' studio/ badai@fonotext-stand:/home/badai/briix-demo/studio/
          rsync -a studio/assets/ badai@fonotext-stand:/home/badai/briix-demo/studio/assets/
          ssh badai@fonotext-stand 'ls /home/badai/briix-demo/studio/ | wc -l'
